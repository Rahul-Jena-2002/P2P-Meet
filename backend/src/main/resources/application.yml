server:
  port: 8080

spring:
  application:
    name: openmeet-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/openmeet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: false

openmeet:
  jwt:
    # Set via environment variable JWT_SECRET (must be >= 256 bits)
    secret: ${JWT_SECRET:}
    ttl-ms: 3600000 # 1 hour
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
  stun:
    urls:
      - "stun:stun.l.google.com:19302"
      - "stun:stun1.l.google.com:19302"
