server:
  port: 8080

spring:
  application:
    name: openmeet-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/openmeet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: false # Using JPA ddl-auto for flexible development without migrations overhead

openmeet:
  jwt:
    secret: ${JWT_SECRET:4a7e9b2c8f1d3e5a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c7d9e1f3a}
    ttl-ms: 3600000 # 1 hour
  stun:
    urls:
      - "stun:stun.l.google.com:19302"
      - "stun:stun1.l.google.com:19302"
